services:
  - type: web
    name: flow-translate-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PROJECT_NAME
        value: Flow Translate
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flow-translate-db
          property: connectionString
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin1234!
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: mixa.minbak@gmail.com
      - key: SMTP_PASSWORD
        value: gfnfvsckwgfaxgpn

databases:
  - name: flow-translate-db
    databaseName: flow_db
    user: flow_user
    plan: free
    region: frankfurt
