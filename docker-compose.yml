services:
  postgres:
    image: postgres:16-alpine
    container_name: flow_postgres
    restart: always
    environment:
      POSTGRES_USER: flow_user
      POSTGRES_PASSWORD: flow_password
      POSTGRES_DB: flow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: